<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 435" role="img" aria-labelledby="title desc"><title id="title">从情绪词到可执行的美术规范</title><desc id="desc">把温馨、经营信息和素材规格转成可以检查的设计。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6c8777"/></marker></defs><rect width="920" height="435" rx="16" fill="#f7f7f0"/><g font-family="system-ui, sans-serif"><text x="32" y="43" fill="#273d35" font-size="24">从情绪词到可执行的美术规范</text><rect x="30" y="90" width="270" height="235" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="50" y="124" fill="#273d35" font-size="20">体验目标</text><text x="50" y="156" fill="#54675c" font-size="15">温馨、清楚、容易观察</text><text x="50" y="185" fill="#54675c" font-size="15">背景少纹理，轮廓清楚</text><text x="50" y="214" fill="#54675c" font-size="15">关键变化有视觉层级</text><rect x="325" y="90" width="270" height="235" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="345" y="124" fill="#273d35" font-size="20">具体设计</text><text x="345" y="156" fill="#54675c" font-size="15">奶油底色 / 深绿操作</text><text x="345" y="185" fill="#54675c" font-size="15">木色桌椅 / 橙色警告</text><text x="345" y="214" fill="#54675c" font-size="15">一套视角、圆角与描边</text><rect x="620" y="90" width="270" height="235" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="640" y="124" fill="#273d35" font-size="20">资产与验收</text><text x="640" y="156" fill="#54675c" font-size="15">桌子、炉灶、菜品、人物</text><text x="640" y="185" fill="#54675c" font-size="15">固定画布与底部锚点</text><text x="640" y="214" fill="#54675c" font-size="15">缩到实际尺寸仍能辨识</text><path d="M303 200 L320 200" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><path d="M598 200 L615 200" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><text x="40" y="380" fill="#273d35" font-size="20">先把样张放进游戏，再扩展整套素材。</text><text x="32" y="413" fill="#708174" font-size="13">本书原创教学图 · 参数用于解释方法</text></g></svg>