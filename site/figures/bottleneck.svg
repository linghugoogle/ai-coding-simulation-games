<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="title desc"><title id="title">为什么加桌子有时没有用</title><desc id="desc">用三个处理阶段的每分钟能力估计瓶颈，厨房最低。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6c8777"/></marker></defs><rect width="920" height="470" rx="16" fill="#f7f7f0"/><g font-family="system-ui, sans-serif"><text x="32" y="43" fill="#273d35" font-size="24">为什么加桌子有时没有用</text><text x="40" y="92" fill="#617565" font-size="16">示意：同一时间段、相近订单结构</text><text x="40" y="155" fill="#273d35" font-size="18">接待与座位</text><rect x="210" y="129" width="620" height="38" rx="5" fill="#9cb8a4"/><text x="840" y="155" fill="#273d35" font-size="16">20 单/分钟</text><text x="40" y="233" fill="#273d35" font-size="18">厨房制作</text><rect x="210" y="207" width="280" height="38" rx="5" fill="#c18450"/><text x="500" y="233" fill="#273d35" font-size="16">9 单/分钟</text><text x="40" y="311" fill="#273d35" font-size="18">交付服务</text><rect x="210" y="285" width="500" height="38" rx="5" fill="#9cb8a4"/><text x="720" y="311" fill="#273d35" font-size="16">16 单/分钟</text><text x="40" y="425" fill="#273d35" font-size="17">先改善厨房，再观察新的限制。此图是估算，不替代真实排队模拟。</text><text x="32" y="448" fill="#708174" font-size="13">本书原创教学图 · 参数用于解释方法</text></g></svg>