<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc"><title id="title">订单状态与资源变化</title><desc id="desc">等待进入制作时扣食材，完成只收一次钱，取消不再继续制作。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6c8777"/></marker></defs><rect width="920" height="460" rx="16" fill="#f7f7f0"/><g font-family="system-ui, sans-serif"><text x="32" y="43" fill="#273d35" font-size="24">订单状态与资源变化</text><rect x="35" y="100" width="245" height="120" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="55" y="134" fill="#273d35" font-size="20">等待 waiting</text><text x="55" y="166" fill="#54675c" font-size="15">占一个接待名额</text><text x="55" y="195" fill="#54675c" font-size="15">尚未扣除食材</text><rect x="337" y="100" width="245" height="120" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="357" y="134" fill="#273d35" font-size="20">制作 cooking</text><text x="357" y="166" fill="#54675c" font-size="15">预留工位并扣食材</text><text x="357" y="195" fill="#54675c" font-size="15">按模拟秒推进</text><rect x="640" y="100" width="245" height="120" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="660" y="134" fill="#273d35" font-size="20">用餐 eating</text><text x="660" y="166" fill="#54675c" font-size="15">完成服务并收款一次</text><text x="660" y="195" fill="#54675c" font-size="15">用餐后离开并释放座位</text><rect x="337" y="300" width="245" height="105" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="357" y="334" fill="#273d35" font-size="20">取消 cancelled</text><text x="357" y="366" fill="#54675c" font-size="15">超时或缺货，记录原因</text><text x="357" y="395" fill="#54675c" font-size="15">已耗食材记入损耗</text><path d="M285 160 L330 160" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><path d="M588 160 L633 160" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><path d="M155 225 L330 340" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><path d="M460 225 L460 293" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><text x="32" y="438" fill="#708174" font-size="13">本书原创教学图 · 参数用于解释方法</text></g></svg>