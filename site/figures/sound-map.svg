<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc"><title id="title">声音先设计事件与含义</title><desc id="desc">一个事件对应一类反馈，音乐与音效分别控制，不依赖声音独占信息。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6c8777"/></marker></defs><rect width="920" height="420" rx="16" fill="#f7f7f0"/><g font-family="system-ui, sans-serif"><text x="32" y="43" fill="#273d35" font-size="24">声音先设计事件与含义</text><rect x="30" y="90" width="270" height="215" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="50" y="124" fill="#273d35" font-size="20">操作反馈</text><text x="50" y="156" fill="#54675c" font-size="15">采购成功：短促低音</text><text x="50" y="185" fill="#54675c" font-size="15">按钮拒绝：轻提示</text><text x="50" y="214" fill="#54675c" font-size="15">目标：确认输入被接受</text><rect x="325" y="90" width="270" height="215" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="345" y="124" fill="#273d35" font-size="20">结果与奖励</text><text x="345" y="156" fill="#54675c" font-size="15">完成一单：明亮单音</text><text x="345" y="185" fill="#54675c" font-size="15">达成目标：短上行音型</text><text x="345" y="214" fill="#54675c" font-size="15">目标：标记有效成果</text><rect x="620" y="90" width="270" height="215" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="640" y="124" fill="#273d35" font-size="20">环境与节奏</text><text x="640" y="156" fill="#54675c" font-size="15">营业音乐：低存在感</text><text x="640" y="185" fill="#54675c" font-size="15">打烊：淡出，留出结算空间</text><text x="640" y="214" fill="#54675c" font-size="15">目标：支持观察而不疲劳</text><text x="40" y="365" fill="#273d35" font-size="19">先做事件表、音量和静音，再考虑更多音乐与环境声。</text><text x="32" y="398" fill="#708174" font-size="13">本书原创教学图 · 参数用于解释方法</text></g></svg>