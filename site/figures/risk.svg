<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc"><title id="title">不确定性要给玩家应对空间</title><desc id="desc">设计中分别提供预测信息、应对动作和反馈。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6c8777"/></marker></defs><rect width="920" height="420" rx="16" fill="#f7f7f0"/><g font-family="system-ui, sans-serif"><text x="32" y="43" fill="#273d35" font-size="24">不确定性要给玩家应对空间</text><rect x="40" y="90" width="255" height="210" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="60" y="124" fill="#273d35" font-size="20">提前知道一部分</text><text x="60" y="156" fill="#54675c" font-size="15">今日预告：可能忙碌</text><text x="60" y="185" fill="#54675c" font-size="15">可查看：当前等待与库存</text><text x="60" y="214" fill="#54675c" font-size="15">不提供：每位顾客的精确到店</text><rect x="332" y="90" width="255" height="210" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="352" y="124" fill="#273d35" font-size="20">能做出准备</text><text x="352" y="156" fill="#54675c" font-size="15">少量补货或保留现金</text><text x="352" y="185" fill="#54675c" font-size="15">选择快菜、增加工位</text><text x="352" y="214" fill="#54675c" font-size="15">忙碌时暂停观察</text><rect x="624" y="90" width="255" height="210" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="644" y="124" fill="#273d35" font-size="20">看得出发生了什么</text><text x="644" y="156" fill="#54675c" font-size="15">缺货、等餐、座位不足</text><text x="644" y="185" fill="#54675c" font-size="15">日报分别写出人数</text><text x="644" y="214" fill="#54675c" font-size="15">需要时请 AI 重放这一局</text><path d="M300 190 L325 190" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><path d="M592 190 L617 190" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><text x="40" y="360" fill="#273d35" font-size="19">避免无预警地清空现金，也避免让随机结果完全盖过经营决策。</text><text x="32" y="398" fill="#708174" font-size="13">本书原创教学图 · 参数用于解释方法</text></g></svg>