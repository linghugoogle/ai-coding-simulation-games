<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc"><title id="title">游戏里实际使用的六种素材</title><desc id="desc">从案例 assets.svg 提取炉灶、桌子、顾客与三种菜品，不是未实现的概念图。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6c8777"/></marker></defs><rect width="920" height="480" rx="16" fill="#f7f7f0"/><g font-family="system-ui, sans-serif"><text x="32" y="43" fill="#273d35" font-size="24">游戏里实际使用的六种素材</text><defs>
<symbol id="stove" viewBox="0 0 80 76"><rect x="9" y="13" width="62" height="52" rx="8" fill="#526a5c"/><rect x="13" y="17" width="54" height="28" rx="4" fill="#dce1ce"/><circle cx="40" cy="31" r="12" fill="#384d42"/><circle cx="40" cy="31" r="7" fill="#c98243"/><rect x="22" y="49" width="35" height="10" rx="3" fill="#293d32"/><circle cx="62" cy="54" r="3" fill="#eac46f"/></symbol>
<symbol id="table" viewBox="0 0 80 76"><rect x="15" y="14" width="50" height="45" rx="10" fill="#cda977" stroke="#a27e51" stroke-width="3"/><rect x="6" y="22" width="8" height="30" rx="3" fill="#8d765a"/><rect x="66" y="22" width="8" height="30" rx="3" fill="#8d765a"/><circle cx="40" cy="35" r="12" fill="#f7efda"/><circle cx="40" cy="35" r="7" fill="#dbd6bd"/></symbol>
<symbol id="customer" viewBox="0 0 80 76"><rect x="15" y="18" width="50" height="43" rx="9" fill="#cda977"/><circle cx="40" cy="37" r="13" fill="#f7efda"/><circle cx="40" cy="15" r="11" fill="#d8b28b"/><path d="M25 66v-8a15 15 0 0 1 30 0v8" fill="#526e5b"/><path d="M30 12a11 11 0 0 1 20 0" fill="#5e4d3a"/></symbol>
<symbol id="dish-simple" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#e5e4ce"/><circle cx="20" cy="20" r="12" fill="#e3b866"/><path d="M13 22l7-10 8 12" stroke="#79915b" stroke-width="5" fill="none"/></symbol>
<symbol id="dish-rice" viewBox="0 0 40 40"><path d="M4 16h32c0 13-7 19-16 19S4 29 4 16" fill="#7eaa9c"/><ellipse cx="20" cy="16" rx="16" ry="8" fill="#f2e5bc"/><path d="M12 15l7-4 10 8" stroke="#b47747" stroke-width="5" fill="none"/></symbol>
<symbol id="dish-set" viewBox="0 0 40 40"><rect x="3" y="7" width="34" height="27" rx="5" fill="#a47751"/><circle cx="13" cy="20" r="7" fill="#f2e5bc"/><rect x="24" y="12" width="9" height="7" rx="2" fill="#7d935b"/><rect x="24" y="22" width="9" height="7" rx="2" fill="#d39a55"/></symbol>
</defs><rect x="30" y="85" width="270" height="160" rx="12" fill="#fbf8ee" stroke="#d3dacb"/><svg x="125" y="93" width="80" height="76"><use href="#stove"/></svg><text x="50" y="198" fill="#273d35" font-size="19">炉灶</text><text x="50" y="226" fill="#69786c" font-size="13">工作时发亮，并显示剩余时间</text><rect x="328" y="85" width="270" height="160" rx="12" fill="#fbf8ee" stroke="#d3dacb"/><svg x="423" y="93" width="80" height="76"><use href="#table"/></svg><text x="348" y="198" fill="#273d35" font-size="19">空桌</text><text x="348" y="226" fill="#69786c" font-size="13">没有顾客时显示桌子和餐盘</text><rect x="626" y="85" width="270" height="160" rx="12" fill="#fbf8ee" stroke="#d3dacb"/><svg x="721" y="93" width="80" height="76"><use href="#customer"/></svg><text x="646" y="198" fill="#273d35" font-size="19">顾客入座</text><text x="646" y="226" fill="#69786c" font-size="13">旁边写明等餐或用餐状态</text><rect x="30" y="265" width="270" height="160" rx="12" fill="#fbf8ee" stroke="#d3dacb"/><svg x="125" y="273" width="80" height="76"><use href="#dish-simple"/></svg><text x="50" y="378" fill="#273d35" font-size="19">简餐</text><text x="50" y="406" fill="#69786c" font-size="13">售价 20 · 制作 10 秒</text><rect x="328" y="265" width="270" height="160" rx="12" fill="#fbf8ee" stroke="#d3dacb"/><svg x="423" y="273" width="80" height="76"><use href="#dish-rice"/></svg><text x="348" y="378" fill="#273d35" font-size="19">盖饭</text><text x="348" y="406" fill="#69786c" font-size="13">售价 30 · 制作 18 秒</text><rect x="626" y="265" width="270" height="160" rx="12" fill="#fbf8ee" stroke="#d3dacb"/><svg x="721" y="273" width="80" height="76"><use href="#dish-set"/></svg><text x="646" y="378" fill="#273d35" font-size="19">招牌套餐</text><text x="646" y="406" fill="#69786c" font-size="13">售价 45 · 制作 30 秒</text><text x="32" y="458" fill="#708174" font-size="13">本书原创教学图 · 参数用于解释方法</text></g></svg>