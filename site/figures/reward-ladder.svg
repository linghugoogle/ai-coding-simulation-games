<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc"><title id="title">三种时间尺度的奖励</title><desc id="desc">即时反馈、每日收益和长期能力共同支撑目标。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6c8777"/></marker></defs><rect width="920" height="480" rx="16" fill="#f7f7f0"/><g font-family="system-ui, sans-serif"><text x="32" y="43" fill="#273d35" font-size="24">三种时间尺度的奖励</text><rect x="35" y="90" width="265" height="235" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="55" y="124" fill="#273d35" font-size="20">即时 · 每一单</text><text x="55" y="156" fill="#54675c" font-size="15">看到餐品完成</text><text x="55" y="185" fill="#54675c" font-size="15">收款提示与满意反馈</text><text x="55" y="214" fill="#54675c" font-size="15">作用：确认行动有效</text><text x="55" y="243" fill="#54675c" font-size="15">风险：特效过多掩盖信息</text><rect x="327" y="90" width="265" height="235" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="347" y="124" fill="#273d35" font-size="20">短期 · 每一天</text><text x="347" y="156" fill="#54675c" font-size="15">现金与日报</text><text x="347" y="185" fill="#54675c" font-size="15">完成服务目标的纪念</text><text x="347" y="214" fill="#54675c" font-size="15">作用：判断计划是否改善</text><text x="347" y="243" fill="#54675c" font-size="15">风险：只有奖励没有原因</text><rect x="619" y="90" width="265" height="235" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="639" y="124" fill="#273d35" font-size="20">长期 · 数天后</text><text x="639" y="156" fill="#54675c" font-size="15">第二工位与新安排</text><text x="639" y="185" fill="#54675c" font-size="15">经营能力与自主表达</text><text x="639" y="214" fill="#54675c" font-size="15">作用：改变下一轮选择</text><text x="639" y="243" fill="#54675c" font-size="15">风险：只有倍率没有新决策</text><text x="40" y="375" fill="#273d35" font-size="19">检查：奖励因什么获得？玩家是否理解？它让下一轮有什么不同？</text><text x="32" y="458" fill="#708174" font-size="13">本书原创教学图 · 参数用于解释方法</text></g></svg>