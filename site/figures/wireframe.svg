<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc"><title id="title">餐厅界面的信息层级</title><desc id="desc">顶部显示今日目标，中间看经营，右侧安排，底部解释原因。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6c8777"/></marker></defs><rect width="920" height="480" rx="16" fill="#f7f7f0"/><g font-family="system-ui, sans-serif"><text x="32" y="43" fill="#273d35" font-size="24">餐厅界面的信息层级</text><rect x="35" y="80" width="850" height="350" rx="8" fill="#fff" stroke="#9bb09e"/><rect x="50" y="95" width="820" height="65" rx="12" fill="#e6eee5" stroke="#b8cabc"/><text x="70" y="129" fill="#273d35" font-size="20">第 1 天 · 现金 1000 · 今日目标 12 单</text><rect x="50" y="178" width="505" height="165" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="70" y="212" fill="#273d35" font-size="20">经营现场</text><text x="70" y="244" fill="#54675c" font-size="15">炉灶 → 待制作订单 → 顾客座位</text><text x="70" y="273" fill="#54675c" font-size="15">显示进度和等待，不堆叠所有按钮</text><rect x="575" y="178" width="295" height="165" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="595" y="212" fill="#273d35" font-size="20">营业前安排</text><text x="595" y="244" fill="#54675c" font-size="15">菜单、价格、采购</text><text x="595" y="273" fill="#54675c" font-size="15">效果与成本紧挨按钮</text><rect x="50" y="360" width="820" height="55" rx="12" fill="#fff0dc" stroke="#b8cabc"/><text x="70" y="394" fill="#273d35" font-size="20">结果解释：6 单因等待离开，先检查厨房产能</text><text x="32" y="458" fill="#708174" font-size="13">本书原创教学图 · 参数用于解释方法</text></g></svg>