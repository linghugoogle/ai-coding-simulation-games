<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc"><title id="title">你说想要什么，AI 做出来，再一起改</title><desc id="desc">你负责选择和试玩，AI 负责编写、接入素材和修错。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6c8777"/></marker></defs><rect width="920" height="480" rx="16" fill="#f7f7f0"/><g font-family="system-ui, sans-serif"><text x="32" y="43" fill="#273d35" font-size="24">你说想要什么，AI 做出来，再一起改</text><rect x="30" y="90" width="255" height="135" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="50" y="124" fill="#273d35" font-size="20">你提出想法</text><text x="50" y="156" fill="#54675c" font-size="15">例如：能保存今天的进度</text><text x="50" y="185" fill="#54675c" font-size="15">说清重新打开后想看到什么</text><rect x="333" y="90" width="255" height="135" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="353" y="124" fill="#273d35" font-size="20">AI 做出预览</text><text x="353" y="156" fill="#54675c" font-size="15">编写代码，接好按钮</text><text x="353" y="185" fill="#54675c" font-size="15">自己检查，再给你打开</text><rect x="635" y="90" width="255" height="135" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="655" y="124" fill="#273d35" font-size="20">你玩一遍</text><text x="655" y="156" fill="#54675c" font-size="15">保存，进入下一天，再读取</text><text x="655" y="185" fill="#54675c" font-size="15">看日期、现金是否恢复</text><rect x="333" y="290" width="255" height="100" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="353" y="324" fill="#273d35" font-size="20">哪里不对，继续说</text><text x="353" y="356" fill="#54675c" font-size="15">描述实际结果，AI 查原因并修改</text><path d="M290 155 L327 155" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><path d="M593 155 L629 155" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><path d="M758 230 L758 340" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><path d="M750 340 L593 340" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><path d="M327 340 L150 340" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><path d="M150 330 L150 230" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><text x="35" y="440" fill="#273d35" font-size="18">不需要先会写代码；每一轮都有能打开、能试的结果。</text><text x="32" y="458" fill="#708174" font-size="13">本书原创教学图 · 参数用于解释方法</text></g></svg>