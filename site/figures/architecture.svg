<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc"><title id="title">一次点击如何变成游戏结果</title><desc id="desc">界面发命令，核心修改状态，渲染读取状态，存档只保存可序列化数据。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6c8777"/></marker></defs><rect width="920" height="480" rx="16" fill="#f7f7f0"/><g font-family="system-ui, sans-serif"><text x="32" y="43" fill="#273d35" font-size="24">一次点击如何变成游戏结果</text><rect x="30" y="90" width="255" height="135" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="50" y="124" fill="#273d35" font-size="20">界面 index.html / ui.mjs</text><text x="50" y="156" fill="#54675c" font-size="15">按钮与数据展示</text><text x="50" y="185" fill="#54675c" font-size="15">不能在这里再扣一遍钱</text><rect x="333" y="90" width="255" height="135" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="353" y="124" fill="#273d35" font-size="20">规则 core.mjs</text><text x="353" y="156" fill="#54675c" font-size="15">检查条件 → 扣费 → 记事件</text><text x="353" y="185" fill="#54675c" font-size="15">现金不足：完整拒绝</text><rect x="635" y="90" width="255" height="135" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="655" y="124" fill="#273d35" font-size="20">状态 state</text><text x="655" y="156" fill="#54675c" font-size="15">现金、库存、订单、工位</text><text x="655" y="185" fill="#54675c" font-size="15">保持可保存、可检查</text><rect x="333" y="290" width="255" height="100" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="353" y="324" fill="#273d35" font-size="20">测试与保存</text><text x="353" y="356" fill="#54675c" font-size="15">直接调用规则；检查输入输出</text><path d="M290 155 L327 155" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><path d="M593 155 L629 155" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><path d="M758 230 L758 340" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><path d="M750 340 L593 340" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><path d="M327 340 L150 340" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><path d="M150 330 L150 230" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><text x="35" y="440" fill="#273d35" font-size="18">规则只处理一次；界面、声音和日报使用同一份结果。</text><text x="32" y="458" fill="#708174" font-size="13">本书原创教学图 · 参数用于解释方法</text></g></svg>