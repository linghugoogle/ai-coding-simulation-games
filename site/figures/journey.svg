<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc"><title id="title">一款游戏从想法到玩家手中</title><desc id="desc">六个阶段及其交付物。每一步都可以验证再继续。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6c8777"/></marker></defs><rect width="920" height="430" rx="16" fill="#f7f7f0"/><g font-family="system-ui, sans-serif"><text x="32" y="43" fill="#273d35" font-size="24">一款游戏从想法到玩家手中</text><rect x="30" y="80" width="270" height="125" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="50" y="114" fill="#273d35" font-size="20">① 研究与立项</text><text x="50" y="146" fill="#54675c" font-size="15">给谁玩？为什么值得做？</text><text x="50" y="175" fill="#54675c" font-size="15">交付：一页立项书</text><rect x="325" y="80" width="270" height="125" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="345" y="114" fill="#273d35" font-size="20">② 设计乐趣</text><text x="345" y="146" fill="#54675c" font-size="15">选择、奖励与可控风险</text><text x="345" y="175" fill="#54675c" font-size="15">交付：规则与体验目标</text><rect x="620" y="80" width="270" height="125" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="640" y="114" fill="#273d35" font-size="20">③ 验证原型</text><text x="640" y="146" fill="#54675c" font-size="15">跑完一轮，找到有趣变化</text><text x="640" y="175" fill="#54675c" font-size="15">交付：第一版可玩循环</text><rect x="30" y="250" width="270" height="125" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="50" y="284" fill="#273d35" font-size="20">④ 生产与实现</text><text x="50" y="316" fill="#54675c" font-size="15">风格、声音、行为、存档</text><text x="50" y="345" fill="#54675c" font-size="15">交付：可测试的游戏</text><rect x="325" y="250" width="270" height="125" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="345" y="284" fill="#273d35" font-size="20">⑤ 测试与打磨</text><text x="345" y="316" fill="#54675c" font-size="15">找错误，也找无聊的地方</text><text x="345" y="345" fill="#54675c" font-size="15">交付：候选发布版</text><rect x="620" y="250" width="270" height="125" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="640" y="284" fill="#273d35" font-size="20">⑥ 上线与迭代</text><text x="640" y="316" fill="#54675c" font-size="15">公开链接、反馈与更新</text><text x="640" y="345" fill="#54675c" font-size="15">交付：真实可接触的作品</text><path d="M303 140 L320 140" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><path d="M598 140 L615 140" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><path d="M755 210 L755 244" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><path d="M615 310 L600 310" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><path d="M320 310 L305 310" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><text x="32" y="408" fill="#708174" font-size="13">本书原创教学图 · 参数用于解释方法</text></g></svg>