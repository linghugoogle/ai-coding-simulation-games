<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc"><title id="title">一款游戏从想法到玩家手中</title><desc id="desc">你提出想法和反馈，AI 帮你完成每一步。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6c8777"/></marker></defs><rect width="920" height="430" rx="16" fill="#f7f7f0"/><g font-family="system-ui, sans-serif"><text x="32" y="43" fill="#273d35" font-size="24">一款游戏从想法到玩家手中</text><rect x="30" y="80" width="270" height="125" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="50" y="114" fill="#273d35" font-size="20">① 说说想做什么</text><text x="50" y="146" fill="#54675c" font-size="15">AI 找几款游戏来比较</text><text x="50" y="175" fill="#54675c" font-size="15">你选喜欢的方向</text><rect x="325" y="80" width="270" height="125" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="345" y="114" fill="#273d35" font-size="20">② 选一种玩法</text><text x="345" y="146" fill="#54675c" font-size="15">AI 用一轮营业解释区别</text><text x="345" y="175" fill="#54675c" font-size="15">你决定先试哪一种</text><rect x="620" y="80" width="270" height="125" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="640" y="114" fill="#273d35" font-size="20">③ 做出能玩的一天</text><text x="640" y="146" fill="#54675c" font-size="15">AI 制作并打开预览</text><text x="640" y="175" fill="#54675c" font-size="15">你点一遍，告诉它哪里不对</text><rect x="30" y="250" width="270" height="125" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="50" y="284" fill="#273d35" font-size="20">⑥ 发布给玩家</text><text x="50" y="316" fill="#54675c" font-size="15">AI 准备文件和发布页面</text><text x="50" y="345" fill="#54675c" font-size="15">你确认后公开，再听反馈</text><rect x="325" y="250" width="270" height="125" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="345" y="284" fill="#273d35" font-size="20">⑤ 请人玩一次</text><text x="345" y="316" fill="#54675c" font-size="15">你观察他哪里卡住</text><text x="345" y="345" fill="#54675c" font-size="15">AI 根据具体问题修改</text><rect x="620" y="250" width="270" height="125" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="640" y="284" fill="#273d35" font-size="20">④ 换画面，加声音</text><text x="640" y="316" fill="#54675c" font-size="15">AI 提供几种样子和试听</text><text x="640" y="345" fill="#54675c" font-size="15">你选合适的，再放进游戏</text><path d="M303 140 L320 140" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><path d="M598 140 L615 140" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><path d="M755 210 L755 244" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><path d="M615 310 L600 310" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><path d="M320 310 L305 310" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><text x="32" y="408" fill="#708174" font-size="13">本书原创教学图 · 参数用于解释方法</text></g></svg>