<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" role="img" aria-labelledby="title desc"><title id="title">发布不是把代码直接扔给玩家</title><desc id="desc">先构建、预览、检查资源与存档，再上传与收集反馈。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6c8777"/></marker></defs><rect width="920" height="380" rx="16" fill="#f7f7f0"/><g font-family="system-ui, sans-serif"><text x="32" y="43" fill="#273d35" font-size="24">发布不是把代码直接扔给玩家</text><rect x="30" y="90" width="270" height="210" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="50" y="124" fill="#273d35" font-size="20">准备可重复的版本</text><text x="50" y="156" fill="#54675c" font-size="15">锁定依赖与 Git 提交</text><text x="50" y="185" fill="#54675c" font-size="15">只打包运行文件</text><text x="50" y="214" fill="#54675c" font-size="15">保留许可与资源清单</text><rect x="325" y="90" width="270" height="210" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="345" y="124" fill="#273d35" font-size="20">检查公开环境</text><text x="345" y="156" fill="#54675c" font-size="15">新浏览器完成一轮</text><text x="345" y="185" fill="#54675c" font-size="15">资源路径与声音解锁</text><text x="345" y="214" fill="#54675c" font-size="15">旧存档与失败恢复</text><rect x="620" y="90" width="270" height="210" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="640" y="124" fill="#273d35" font-size="20">发布与更新</text><text x="640" y="156" fill="#54675c" font-size="15">真实截图和操作说明</text><text x="640" y="185" fill="#54675c" font-size="15">反馈入口与版本号</text><text x="640" y="214" fill="#54675c" font-size="15">上一版构建与回退计划</text><path d="M303 190 L320 190" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><path d="M598 190 L615 190" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><text x="32" y="358" fill="#708174" font-size="13">本书原创教学图 · 参数用于解释方法</text></g></svg>