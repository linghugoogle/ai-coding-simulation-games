<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc"><title id="title">玩家为什么愿意再经营一天</title><desc id="desc">目标引出选择，不确定性形成期待，结果和奖励支持下一次目标。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6c8777"/></marker></defs><rect width="920" height="480" rx="16" fill="#f7f7f0"/><g font-family="system-ui, sans-serif"><text x="32" y="43" fill="#273d35" font-size="24">玩家为什么愿意再经营一天</text><rect x="30" y="85" width="255" height="130" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="50" y="119" fill="#273d35" font-size="20">一个看得见的目标</text><text x="50" y="151" fill="#54675c" font-size="15">例如：服务 12 位顾客</text><text x="50" y="180" fill="#54675c" font-size="15">知道想实现什么</text><rect x="333" y="85" width="255" height="130" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="353" y="119" fill="#273d35" font-size="20">一次有代价的选择</text><text x="353" y="151" fill="#54675c" font-size="15">买食材，还是存钱添炉灶？</text><text x="353" y="180" fill="#54675c" font-size="15">计划可以被玩家影响</text><rect x="635" y="85" width="255" height="130" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="655" y="119" fill="#273d35" font-size="20">有线索的不确定性</text><text x="655" y="151" fill="#54675c" font-size="15">预告客流，保留到店差异</text><text x="655" y="180" fill="#54675c" font-size="15">提前准备能减轻风险</text><rect x="635" y="270" width="255" height="130" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="655" y="304" fill="#273d35" font-size="20">结果与及时反馈</text><text x="655" y="336" fill="#54675c" font-size="15">多完成 3 单，排队缩短</text><text x="655" y="365" fill="#54675c" font-size="15">知道变化来自什么</text><rect x="333" y="270" width="255" height="130" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="353" y="304" fill="#273d35" font-size="20">有意义的收获</text><text x="353" y="336" fill="#54675c" font-size="15">现金、解锁、掌握规律</text><text x="353" y="365" fill="#54675c" font-size="15">下次有了不同做法</text><rect x="30" y="270" width="255" height="130" rx="12" fill="#edf3ed" stroke="#b8cabc"/><text x="50" y="304" fill="#273d35" font-size="20">形成下一步期待</text><text x="50" y="336" fill="#54675c" font-size="15">更高峰值或更好的布局</text><text x="50" y="365" fill="#54675c" font-size="15">不是单纯把数字放大</text><path d="M289 150 L327 150" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><path d="M592 150 L629 150" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><path d="M760 220 L760 264" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><path d="M629 335 L594 335" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><path d="M327 335 L290 335" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><path d="M155 264 L155 220" fill="none" stroke="#6c8777" stroke-width="2" marker-end="url(#a)"/><text x="32" y="458" fill="#708174" font-size="13">本书原创教学图 · 参数用于解释方法</text></g></svg>